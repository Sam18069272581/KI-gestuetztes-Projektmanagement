[project]
name = "pm-agent"
version = "0.1.0"
description = "KI-Agent für die Planungsphase von Softwareprojekten (Projektgruppe 4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
